[project]
name = "mixa"
version = "0.1.0"
description = "Understands code-switched, phonetically spelled, cross-script text without 'correcting' it."
readme = "README.md"
authors = [
    { name = "Abdul Bari Mohammed", email = "156886033+AbdulBari357@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "joblib>=1.6.0",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sklearn-crfsuite>=0.5.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
ml = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["ml/data"]  # downloaded third-party datasets and their code

[tool.ruff.lint]
# EXE002: every file looks executable through the Windows -> Docker bind mount.
# SIM905: whitespace-split word lists are easier to edit than list literals.
ignore = ["EXE002", "SIM905"]
